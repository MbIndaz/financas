<VirtualHost *:80>
    ServerName mbmfinancas.duckdns.org

    # Não encaminhar o desafio ACME para a API: o certbot --apache tem de o servir.
    ProxyPass /.well-known/acme-challenge/ !

    # O Apache termina o TLS e fala HTTP com a API em 127.0.0.1:8000.
    # ProxyPreserveHost mantém o Host original e X-Forwarded-Proto diz ao uvicorn
    # (arrancado com --proxy-headers) que o pedido original era HTTPS, para que
    # redirects e URLs absolutos gerados pela API usem https:// e não http://.
    # O certbot copia este bloco para a variante SSL (*-le-ssl.conf).
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/mbmfinancas-error.log
    CustomLog ${APACHE_LOG_DIR}/mbmfinancas-access.log combined
</VirtualHost>
